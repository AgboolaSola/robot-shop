# Send all shop traffic through Traefik so every request is measured.
# Each /api path is its own route, so metrics show catalogue, cart and
# payment separately. All routes go to web, which forwards /api/... on.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: robot-shop
  namespace: robot-shop
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/catalogue
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
          - path: /api/cart
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
          - path: /api/payment
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
