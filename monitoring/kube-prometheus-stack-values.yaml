prometheus:
  prometheusSpec:
    # Also pick up metrics targets and alert rules from other places (Traefik, our SLO rule)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d

grafana:
  # Admin login comes from a Kubernetes Secret, not from this file
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Logs: let Grafana search Loki (Capstone 2 step 3)
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.logging.svc.cluster.local:3100
      access: proxy

alertmanager:
  alertmanagerSpec:
    # Mount the Slack webhook Secret as a file; the URL never appears in Git
    secrets:
      - alertmanager-slack
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Only Robot Shop alerts go to Slack; the stack's built-in alerts are ignored
        - receiver: slack
          matchers:
            - team="robot-shop"
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
            send_resolved: true
            title: '{{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              {{ end }}

# kind runs these parts of Kubernetes in a way Prometheus can't reach,
# so turn them off to avoid false "target down" alerts
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
