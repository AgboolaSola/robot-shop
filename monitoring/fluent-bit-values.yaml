# Fluent Bit runs on every node, reads each container's log file,
# adds Kubernetes labels (namespace, service, pod) and sends it to Loki.
# Only Robot Shop's logs are collected, to keep it light.
config:
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*_robot-shop_*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name            loki
        Match           kube.*
        Host            loki.logging.svc.cluster.local
        Port            3100
        Labels          job=fluent-bit, namespace=$kubernetes['namespace_name'], service=$kubernetes['labels']['service'], pod=$kubernetes['pod_name']
        Remove_Keys     kubernetes, stream, _p
        Line_Format     json
        Drop_Single_Key raw
